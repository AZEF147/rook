    // Initialize App
    async function initApp() {
      // 1. Immediate visual rendering from rock-solid defaults (no blank frame)
      const savedUser = localStorage.getItem('edumaster_user');
      if (savedUser) {
        try {
          appState.user = JSON.parse(savedUser);
        } catch (e) {}
      }
      updateNavUser();
      renderCurrentView();

      // Show onboarding modal on first load if not logged in
      if (!savedUser && !sessionStorage.getItem('edumaster_onboarding_shown')) {
        sessionStorage.setItem('edumaster_onboarding_shown', 'true');
        showOnboardingModal();
      }

      // 2. Fetch server state with automatic silent retry
      async function syncServerState(attempt = 1) {
        try {
          const res = await fetch('/api/state');
          if (!res.ok) throw new Error('Status: ' + res.status);
          const json = await res.json();
          if (json && json.success && json.data) {
            appState = { ...appState, ...json.data };
            updateNavUser();
            renderCurrentView();
          }
        } catch (err) {
          console.warn('Sync attempt ' + attempt + ': ' + err.message);
          if (attempt < 3) {
            setTimeout(() => syncServerState(attempt + 1), 1500);
          }
        }
      }

      syncServerState();
    }

    async function handleRegisterStudent(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const parentPhone = document.getElementById('regParentPhone').value.trim();
      const grade = document.getElementById('regGrade').value;
      const subject = document.getElementById('regSubject').value;
      const teacherCode = document.getElementById('regCode').value.trim();

      try {
        const res = await fetch('/api/register-student', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, parentPhone, grade, subject, teacherCode })
        });
        const data = await res.json();
        if (data.success) {
          appState.user = data.user;
          localStorage.setItem('edumaster_user', JSON.stringify(data.user));
          updateNavUser();
          closeModal();
          openWhatsNewModal();
          renderCurrentView();
        } else {
          alert(data.message || 'حدث خطأ في التسجيل');
        }
      } catch (err) {
        alert('تعذر الاتصال بالخادم: ' + err.message);
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      let payload = { role: currentAuthRole };
      if (currentAuthRole === 'student') {
        payload.studentPhone = document.getElementById('loginPhone').value.trim();
      } else {
        payload.email = document.getElementById('loginEmail').value.trim();
        payload.password = document.getElementById('loginPass').value.trim();
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          appState.user = data.user;
          localStorage.setItem('edumaster_user', JSON.stringify(data.user));
          updateNavUser();
          closeModal();
          renderCurrentView();
        } else {
          alert(data.message || 'بيانات الدخول غير صحيحة');
        }
      } catch (err) {
        alert('تعذر الدخول: ' + err.message);
      }
    }

    // WHITEBOARD ENGINE
    let currentColor = '#2563eb';
    function setBoardColor(c) { currentColor = c; }
    function clearWhiteboard() {
      const cvs = document.getElementById('whiteboardCanvas');
      if (cvs) {
        const ctx = cvs.getContext('2d');
        ctx.clearRect(0, 0, cvs.width, cvs.height);
      }
    }
    function initWhiteboard() {
      const cvs = document.getElementById('whiteboardCanvas');
      if (!cvs) return;
      const ctx = cvs.getContext('2d');
      let drawing = false;

      cvs.onmousedown = (e) => {
        drawing = true;
        ctx.beginPath();
        const rect = cvs.getBoundingClientRect();
        ctx.moveTo((e.clientX - rect.left) * (cvs.width / rect.width), (e.clientY - rect.top) * (cvs.height / rect.height));
      };
      cvs.onmousemove = (e) => {
        if (!drawing) return;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = currentColor;
        const rect = cvs.getBoundingClientRect();
        ctx.lineTo((e.clientX - rect.left) * (cvs.width / rect.width), (e.clientY - rect.top) * (cvs.height / rect.height));
        ctx.stroke();
      };
      cvs.onmouseup = () => { drawing = false; };
      cvs.onmouseleave = () => { drawing = false; };
    }

    async function sendDossierMessage(studentId) {
      const input = document.getElementById('dossierChatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const senderName = appState.user ? appState.user.name : 'المعلم';
      const senderRole = appState.user ? appState.user.role : 'teacher';

      try {
        const res = await fetch('/api/student-chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ studentId, sender: senderName, senderRole, text })
        });
        const data = await res.json();
        if (data.success) {
          const box = document.getElementById('dossierChatBox');
          if (box) {
            box.innerHTML = (data.messages || []).map(m => `
              <div class="p-2 rounded-xl ${m.senderRole === 'student' ? 'bg-white border border-slate-200' : 'bg-blue-600 text-white'}">
                <div class="flex items-center justify-between text-[10px] opacity-75 mb-0.5">
                  <span>${m.sender}</span>
                  <span>${m.time}</span>
                </div>
                <p class="font-medium">${m.text}</p>
              </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
          }
        }
      } catch (err) {}
    }

                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${t.status === 'completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                            ${t.status === 'completed' ? 'مكتملة ومفعلة' : 'بانتظار التأكيد'}
                          </span>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `}
        </div>
      `;
    }

    // WHAT'S NEW MODAL
    function openWhatsNewModal() {
      const modal = document.getElementById('modalContent');
      modal.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div class="flex items-center gap-2">
              <span class="text-xl">✨</span>
              <h3 class="text-base font-black text-slate-900">ما الجديد في منصة EduMaster Pro؟</h3>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
          </div>

          <div class="space-y-3">
            ${(appState.whatsNew || []).map(w => `
              <div class="p-3.5 rounded-2xl bg-blue-50/60 border border-blue-100 space-y-1">
                <div class="flex items-center justify-between">
                  <h4 class="font-bold text-xs text-blue-950">${w.title}</h4>
                  <span class="text-[10px] text-blue-500 font-semibold">${w.date}</span>
                </div>
                <p class="text-xs text-slate-600 leading-relaxed">${w.desc}</p>
              </div>
            `).join('')}
          </div>

          <div class="pt-2">
            <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-blue-600 text-white text-xs font-bold transition">
              حسناً، ابدأ التصفح
            </button>
          </div>
        </div>
      `;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    // GITHUB SYNC & SOURCE CODE COMPRESSION MODAL
    function openGitHubModal() {
      const modal = document.getElementById('modalContent');
      modal.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div class="flex items-center gap-2">
              <svg class="w-5 h-5 text-slate-900" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
              <h3 class="text-base font-black text-slate-900">ضغط الكود ومزامنة مستودع GitHub</h3>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
          </div>

          <div class="p-3.5 rounded-2xl bg-blue-50/80 border border-blue-200 text-xs space-y-2">
            <p class="font-bold text-blue-900">📦 تحميل الكود مضغوطاً بضغطة زر واحدة:</p>
            <a href="/api/download-zip" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold flex items-center justify-center gap-1.5 shadow-sm transition">
              <span>📥</span> تنزيل أرشيف المشروع كاملاً (EduMasterPro.zip)
            </a>
          </div>

          <div class="space-y-2.5 text-xs">
            <h4 class="font-bold text-slate-800">أو المزامنة المباشرة مع GitHub API:</h4>
            
            <div>
              <label class="block text-slate-600 font-bold mb-1">رابط مستودع GitHub:</label>
              <input type="url" id="ghUrl" placeholder="https://github.com/username/my-edumaster-repo.git" value="https://github.com/edumaster-egypt/edumaster-pro.git" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-mono text-xs outline-none focus:border-blue-600" />
            </div>

            <div>
              <label class="block text-slate-600 font-bold mb-1">رمز الوصول الشخصي (GitHub Personal Access Token):</label>
              <input type="password" id="ghToken" placeholder="ghp_••••••••••••••••••••••••" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-mono text-xs outline-none focus:border-blue-600" />
            </div>

            <div>
              <label class="block text-slate-600 font-bold mb-1">رسالة التحديث (Commit Message):</label>
              <input type="text" id="ghMsg" value="إطلاق منصة EduMaster Pro بتصميم مشرق وعصري وألوان زاهية" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs outline-none focus:border-blue-600" />
            </div>

            <button onclick="syncToGitHub()" id="btnSyncGh" class="w-full py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-black transition flex items-center justify-center gap-2">
              <span>🚀</span> ضغط ومزامنة الكود مع GitHub تلقائياً
            </button>

            <div id="ghLogBox" class="hidden p-3 rounded-xl bg-slate-900 text-emerald-400 font-mono text-[11px] max-h-32 overflow-y-auto space-y-1"></div>
          </div>
        </div>
      `;
      document.getElementById('modalOverlay').classList.remove('hidden');
    }

    async function syncToGitHub() {
      const repoUrl = document.getElementById('ghUrl').value.trim();
      const token = document.getElementById('ghToken').value.trim();
      const commitMsg = document.getElementById('ghMsg').value.trim();
      const btn = document.getElementById('btnSyncGh');
      const logBox = document.getElementById('ghLogBox');

      btn.disabled = true;
      btn.innerText = 'جاري ضغط الكود والمزامنة مع GitHub...';
      logBox.classList.remove('hidden');
      logBox.innerHTML = '<p>📦 جاري ضغط ملفات المشروع...</p>';

      try {
        const res = await fetch('/api/compress-and-upload-github', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoUrl, token, commitMsg })
        });
        const data = await res.json();
        btn.disabled = false;
        btn.innerText = '🚀 ضغط ومزامنة الكود مع GitHub تلقائياً';
        if (data.logs) {
          logBox.innerHTML = (data.logs || []).map(l => `<p>${l}</p>`).join('');
        }
        if (data.success) {
          alert('✅ تمت عملية ضغط الكود والمزامنة بنجاح!');
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = '🚀 ضغط ومزامنة الكود مع GitHub تلقائياً';
        logBox.innerHTML += `<p class="text-rose-400">خطأ: ${err.message}</p>`;
      }
    }

    // RUN ON LOAD
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
